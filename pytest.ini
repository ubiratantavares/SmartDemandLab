[pytest]
# Configuração do pytest – SmartDemandLab (US-11)
# Referências: QA_PLAN.md (seções 1 e 2), ARCHITECTURE.md (estratégia de testes).

minversion = 9.0
testpaths = tests
# Raiz de importação dos pacotes de camada (ui, app, domain, infrastructure).
pythonpath = src

addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80

# Marcadores alinhados aos tipos de teste do QA_PLAN.md.
markers =
    integration: fluxo completo ingestão -> previsão -> controle
    performance: tempo de treinamento e inferência dos modelos
    regression: comparação de métricas (RMSE, MAE, PI Coverage) entre versões
    slow: testes lentos (excluir com -m "not slow")

# Logging
log_level = INFO
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
